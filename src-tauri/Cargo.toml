[package]
name = "nospy"
version = "1.0.0"
description = "NoSpy AntiSpyware & Threat Defense"
authors = ["NoSpy Team"]
edition = "2024"

[lib]
name = "nospy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
winreg = "0.52"
walkdir = "2.5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
netstat2 = "0.9"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
